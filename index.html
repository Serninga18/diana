<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carta · Cafetería Diana</title>
    <meta name="description" content="Carta de Cafetería Diana, desde 1982">
    <style>
        :root {
            /* Colores sacados del logo. Para otro bar, cambia solo estos */
            --verde: #1f7a58;
            /* acento y precios */
            --marron: #4a3626;
            /* texto */
            --tostado: #b88f5e;
            /* líneas decorativas */
            --fondo: #ffffff;
            --suave: #7a6a5c;
            --linea: #eadfd0;
            color-scheme: light;
            box-sizing: border-box;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--fondo);
            color: var(--marron);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .envoltorio {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 18px;
        }

        .oculto {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        header {
            padding: 22px 0 8px;
        }

        .marco {
            text-align: center;
            padding: 18px 16px 16px;
            border: 4px double var(--tostado);
            outline: 1px solid var(--tostado);
            outline-offset: 4px;
        }

        .marco img {
            display: block;
            width: min(220px, 60%);
            height: auto;
            margin: 0 auto;
        }

        .lema {
            margin: 8px 0 0;
            color: var(--suave);
            font-size: .95rem;
        }

        .datos {
            margin: 10px 0 0;
            padding: 0;
            list-style: none;
            font-size: .9rem;
            color: var(--suave);
        }

        .datos:empty {
            display: none;
        }

        .datos li+li {
            margin-top: 2px;
        }

        .datos a {
            color: var(--verde);
            font-weight: 600;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--fondo);
            border-bottom: 1px solid var(--linea);
            margin-top: 14px;
        }

        nav ul {
            display: flex;
            gap: 8px;
            margin: 0 auto;
            padding: 10px 18px;
            list-style: none;
            max-width: 640px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        nav ul::-webkit-scrollbar {
            display: none;
        }

        nav a {
            display: block;
            white-space: nowrap;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid var(--verde);
            color: var(--verde);
            font-size: .92rem;
        }

        nav a:hover {
            background: var(--verde);
            color: #fff;
        }

        nav a:focus-visible,
        .datos a:focus-visible {
            outline: 3px solid var(--marron);
            outline-offset: 2px;
        }

        section {
            padding-top: 28px;
            scroll-margin-top: 56px;
        }

        h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 4px;
            font: italic 700 1.45rem/1.2 "Iowan Old Style", Georgia, "Times New Roman", serif;
            color: var(--verde);
        }

        h2::after {
            content: "";
            flex: 1;
            border-top: 1px solid var(--tostado);
        }

        .nota-seccion {
            margin: 0 0 6px;
            color: var(--suave);
            font-size: .9rem;
        }

        ul.items {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .item {
            padding: 11px 0;
            border-bottom: 1px dotted var(--linea);
        }

        .item:last-child {
            border-bottom: 0;
        }

        .fila {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .nombre {
            flex: 1;
            font: italic 600 1.05rem/1.35 "Iowan Old Style", Georgia, "Times New Roman", serif;
        }

        .precio {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            white-space: nowrap;
            color: var(--verde);
        }

        .desc {
            margin: 1px 0 0;
            color: var(--suave);
            font-size: .9rem;
        }

        footer {
            margin-top: 36px;
            padding: 20px 0 48px;
            border-top: 4px double var(--tostado);
            color: var(--suave);
            font-size: .85rem;
            text-align: center;
        }

        footer p {
            margin: 0 0 6px;
        }

        footer p.destacado {
            color: var(--marron);
            font-weight: 600;
        }
    </style>
</head>

    <nav aria-label="Secciones de la carta">
        <ul id="indice"></ul>
    </nav>

    <main class="envoltorio" id="carta">
        <noscript>Activa JavaScript para ver la carta.</noscript>
    </main>

    <footer>
        <div class="envoltorio" id="pie"></div>
    </footer>

    <script>
        /* ============================================================
           ADAPTAR A CADA BAR: edita solo este bloque.
           - "precio" puede ser un número (2.5) o un texto ("4 / 5").
           - "desc" y "nota" son opcionales.
           - Los campos vacíos ("") no se muestran.
           - PRODUCTOS Y PRECIOS DE EJEMPLO: sustituir por los reales.
           ============================================================ */
        const CARTA = {
            nombre: "Cafetería Diana",
            lema: "Desde 1982",
            telefono: "",
            direccion: "",
            horario: [],
            avisoPie: [
                { texto: "Carta de ejemplo: productos y precios de muestra.", destacado: true },
                { texto: "Precios con IVA incluido." },
                { texto: "Si tienes alguna alergia o intolerancia, avisa al personal antes de pedir." }
            ],
            secciones: [
                {
                    titulo: "Cafés",
                    items: [
                        { nombre: "Café solo", precio: 1.3 },
                        { nombre: "Café con leche", precio: 1.5 },
                        { nombre: "Cortado", precio: 1.4 },
                        { nombre: "Capuchino", precio: 2.0 },
                        { nombre: "Infusión", precio: 1.5 },
                        { nombre: "Chocolate caliente", precio: 2.2 }
                    ]
                },
                {
                    titulo: "Desayunos",
                    items: [
                        { nombre: "Tostada con tomate", precio: 2.0 },
                        { nombre: "Tostada con jamón", precio: 2.8 },
                        { nombre: "Napolitana", precio: 1.6 },
                        { nombre: "Zumo de naranja natural", precio: 2.5 }
                    ]
                },
                {
                    titulo: "Bocadillos",
                    nota: "Montado / Bocadillo",
                    items: [
                        { nombre: "Jamón serrano", precio: "3 / 4" },
                        { nombre: "Tortilla", precio: "3 / 4" },
                        { nombre: "Lomo y queso", precio: "3,50 / 4,50" }
                    ]
                },
                {
                    titulo: "Bebidas",
                    items: [
                        { nombre: "Caña", precio: 1.6 },
                        { nombre: "Refrescos", precio: 2.0 },
                        { nombre: "Agua", precio: 1.5 }
                    ]
                }
            ]
        };

        /* ---------- A partir de aquí no hace falta tocar nada ---------- */
        const euros = n => n.toLocaleString("es-ES", {
            minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
            maximumFractionDigits: 2
        });
        const formatear = p => (typeof p === "number" ? euros(p) : String(p)) + " €";
        const el = (tag, clase, texto) => {
            const e = document.createElement(tag);
            if (clase) e.className = clase;
            if (texto !== undefined) e.textContent = texto;
            return e;
        };
        const slug = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

        document.title = "Carta · " + CARTA.nombre;
        document.getElementById("nombre").textContent = CARTA.nombre;
        document.getElementById("logo").alt = CARTA.nombre + (CARTA.lema ? ", " + CARTA.lema.toLowerCase() : "");
        document.getElementById("lema").textContent = CARTA.lema || "";

        const datos = document.getElementById("datos");
        (CARTA.horario || []).forEach(h => datos.append(el("li", "", h)));
        if (CARTA.direccion) datos.append(el("li", "", CARTA.direccion));
        if (CARTA.telefono) {
            const li = el("li");
            const a = el("a", "", "Tel. " + CARTA.telefono);
            a.href = "tel:" + CARTA.telefono.replace(/\s+/g, "");
            li.append(a);
            datos.append(li);
        }

        const indice = document.getElementById("indice");
        const main = document.getElementById("carta");
        main.querySelector("noscript")?.remove();

        CARTA.secciones.forEach(s => {
            const id = slug(s.titulo);
            const li = el("li");
            const a = el("a", "", s.titulo);
            a.href = "#" + id;
            li.append(a);
            indice.append(li);

            const sec = el("section");
            sec.id = id;
            sec.append(el("h2", "", s.titulo));
            if (s.nota) sec.append(el("p", "nota-seccion", s.nota));
            const ul = el("ul", "items");
            s.items.forEach(it => {
                const item = el("li", "item");
                const fila = el("div", "fila");
                fila.append(el("span", "nombre", it.nombre));
                if (it.precio !== undefined) fila.append(el("span", "precio", formatear(it.precio)));
                item.append(fila);
                if (it.desc) item.append(el("p", "desc", it.desc));
                ul.append(item);
            });
            sec.append(ul);
            main.append(sec);
        });

        const pie = document.getElementById("pie");
        (CARTA.avisoPie || []).forEach(t => pie.append(el("p", t.destacado ? "destacado" : "", t.texto)));
    </script>
</body>
